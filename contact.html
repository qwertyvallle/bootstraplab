<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBlog | Контакти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <!-- Навігація[cite: 4] -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="index.html">TECH_BLOG</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Про нас</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Контакти</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container w-50">
        <!-- Alert[cite: 12] -->
        <div class="alert alert-info mb-4">
            Заповніть форму нижче, щоб зв'язатися з редакцією.
        </div>

        <!-- Форма[cite: 11] -->
        <form class="p-4 bg-secondary bg-opacity-25 rounded border border-secondary">
            <div class="mb-3">
                <label class="form-label">Ваше ім'я</label>
                <input type="text" class="form-control" placeholder="Ім'я">
            </div>
            <div class="mb-3">
                <label class="form-label">Електронна пошта</label>
                <input type="email" class="form-control" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Повідомлення</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-info w-100">Надіслати</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
